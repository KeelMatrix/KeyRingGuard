name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Verify hidden child PowerShell launch guard
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1 -SelfTest

      - name: Scan repository child PowerShell launches
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1

      - name: Restore from NuGet.org
        run: dotnet restore KeelMatrix.KeyRingGuard.sln --configfile NuGet.config --no-cache --force

      - name: Verify formatting
        run: dotnet format KeelMatrix.KeyRingGuard.sln --no-restore --verify-no-changes

      - name: Verify changelog contract
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pwsh -NoProfile -File scripts/Test-ChangelogContract.ps1 -Tag v0.1.0 -ExpectedCommit $env:EXPECTED_COMMIT

      - name: Verify release workflow contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyReleaseWorkflowContract.ps1

      - name: Verify package icon contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyPackageIconContract.ps1

      - name: Verify CI workflow contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyCiWorkflowContract.ps1

      - name: Verify vulnerability audit contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyVulnerabilityAuditContract.ps1

      - name: Verify release script portability
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyReleaseScriptPortability.ps1

      - name: Verify history hygiene contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyHistoryHygieneContract.ps1

      - name: Verify history and workspace hygiene
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Test-HistoryHygiene.ps1

      - name: Run dependency vulnerability audit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-VulnerabilityAudit.ps1

      - name: Build Release
        run: dotnet build KeelMatrix.KeyRingGuard.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test KeelMatrix.KeyRingGuard.sln --configuration Release --no-build

      - name: Pack package and symbols
        run: dotnet pack src/KeelMatrix.KeyRingGuard/KeelMatrix.KeyRingGuard.csproj --configuration Release --no-build --include-symbols --p:SymbolPackageFormat=snupkg -p:RequirePackageIcon=false --output ./artifacts/packages

      - name: Inspect package contents and optional icon
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Inspect-Package.ps1 -Version 0.1.0 -PackagePath ./artifacts/packages/KeelMatrix.KeyRingGuard.0.1.0.nupkg -AllowMissingIcon

      - name: Package consumer smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-PackageConsumerSmoke.ps1
