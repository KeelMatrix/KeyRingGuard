name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore from NuGet.org
        run: dotnet restore KeelMatrix.KeyRingGuard.sln --configfile NuGet.config --no-cache --force

      - name: Verify formatting
        run: dotnet format KeelMatrix.KeyRingGuard.sln --no-restore --verify-no-changes

      - name: Build Release
        run: dotnet build KeelMatrix.KeyRingGuard.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test KeelMatrix.KeyRingGuard.sln --configuration Release --no-build

      - name: Pack package and symbols
        run: dotnet pack src/KeelMatrix.KeyRingGuard/KeelMatrix.KeyRingGuard.csproj --configuration Release --no-build --include-symbols --p:SymbolPackageFormat=snupkg --output ./artifacts/packages

      - name: Package consumer smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-PackageConsumerSmoke.ps1
