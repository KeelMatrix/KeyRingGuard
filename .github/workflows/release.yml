name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derive and validate release tag
        id: release-version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (& pwsh -NoProfile -File scripts/GetReleaseVersion.ps1 -Tag $env:RELEASE_TAG | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) { throw 'Could not derive a release version from the tag.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate changelog and repository versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pwsh -NoProfile -File scripts/Test-ChangelogContract.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:EXPECTED_COMMIT

      - name: Restore from NuGet.org
        run: dotnet restore KeelMatrix.KeyRingGuard.sln --configfile NuGet.config --no-cache --force

      - name: Vulnerability audit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-VulnerabilityAudit.ps1

      - name: Build Release
        run: dotnet build KeelMatrix.KeyRingGuard.sln --configuration Release --no-restore -p:Version=${{ steps.release-version.outputs.version }}

      - name: Test Release
        run: dotnet test KeelMatrix.KeyRingGuard.sln --configuration Release --no-build -p:Version=${{ steps.release-version.outputs.version }}

      - name: Pack exact release artifacts
        run: dotnet pack src/KeelMatrix.KeyRingGuard/KeelMatrix.KeyRingGuard.csproj --configuration Release --no-build --include-symbols -p:SymbolPackageFormat=snupkg -p:Version=${{ steps.release-version.outputs.version }} --output ./artifacts/packages

      - name: Inspect package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Inspect-Package.ps1 -Version ${{ steps.release-version.outputs.version }} -PackagePath ./artifacts/packages/KeelMatrix.KeyRingGuard.${{ steps.release-version.outputs.version }}.nupkg

      - name: Validate exact artifact set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $expected = @(
            "KeelMatrix.KeyRingGuard.$env:RELEASE_VERSION.nupkg",
            "KeelMatrix.KeyRingGuard.$env:RELEASE_VERSION.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual) -ne $null) { throw "Unexpected release artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')." }

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-packages
          path: |
            ./artifacts/packages/KeelMatrix.KeyRingGuard.${{ steps.release-version.outputs.version }}.nupkg
            ./artifacts/packages/KeelMatrix.KeyRingGuard.${{ steps.release-version.outputs.version }}.snupkg
          if-no-files-found: error

  publish:
    name: Publish validated release
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-release-packages
          path: ./artifacts/packages

      - name: Validate downloaded artifact set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) { throw 'The validation job did not provide a release version.' }
          $expected = @(
            "KeelMatrix.KeyRingGuard.$env:RELEASE_VERSION.nupkg",
            "KeelMatrix.KeyRingGuard.$env:RELEASE_VERSION.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual) -ne $null) { throw "Unexpected downloaded release artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')." }

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish validated package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/packages/KeelMatrix.KeyRingGuard.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
